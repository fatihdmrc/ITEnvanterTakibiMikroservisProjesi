services:
  postgres:
    image: postgres:16
    container_name: it-envanter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: itenvanter
      POSTGRES_PASSWORD: itenvanter123
      POSTGRES_DB: it_envanter_takip
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
